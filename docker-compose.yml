version: '3.8'

services:
  attaya-beauty-luxe:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attaya_beauty_luxe_app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-https://attayaluxe.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-XXXXX}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-SB-Mid-client-YYYYY}
      MIDTRANS_MERCHANT_ID: ${MIDTRANS_MERCHANT_ID:-G123456789}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      VITE_ADMIN_PASSWORD: ${VITE_ADMIN_PASSWORD:-ATTAYA2026}
    ports:
      - "3000:3000"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
